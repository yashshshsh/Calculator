<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="calculator.css">
    <title>Calculator</title>
</head>
<body>
    <div class="heading">
        <p>NumeroBliss</p>
    </div>
    <div class="container">
        <div class="calci">
            <div class="upper">
                <div class="display"></div>
                <button class="upperC">c</button>
            </div>
            <div class="lower">
                <button class="lowerk">1</button>
                <button class="lowerk">2</button>
                <button class="lowerk">3</button>
                <button class="lowerk" id="slash">/</button>
                <button class="lowerk">4</button>
                <button class="lowerk">5</button>
                <button class="lowerk">6</button>
                <button class="lowerk" id="multiply">*</button>
                <button class="lowerk">7</button>
                <button class="lowerk">8</button>
                <button class="lowerk">9</button>
                <button class="lowerk" id="minus">-</button>
                <button class="lowerk">0</button>
                <button class="lowerk" id="AC">AC</button>
                <button class="lowerk" id="equal">=</button>
                <button class="lowerk" id="plus">+</button>
            </div>
        </div>
    </div> 
    <script src="calculator.js"></script>
</body>
</html>
